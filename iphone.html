async function ytapi(path,p){const u=new URL('https://www.googleapis.com/youtube/v3/'+path);Object.entries({...p,key:YT_API_KEY}).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u),j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);return j}

 try{const j=q?await ytapi('search',{part:'snippet',type:'video',maxResults:20,q}):await ytapi('videos',{part:'snippet',chart:'mostPopular',maxResults:20,regionCode:'SA'});
  l.innerHTML=j.items.map(v=>`<div class="vc" data-id="${esc(v.id.videoId||v.id)}"><img src="${esc(v.snippet.thumbnails.medium.url)}" alt=""><p>${esc(v.snippet.title)}</p><small>${esc(v.snippet.channelTitle)}</small></div>`).join('')||'<p class="ms">No results</p>'}
 catch(x){loaded=0;l.innerHTML=`<p class="ms">${esc(x.message)}</p>`}}
function play(id,t,c){ytUrl=`https://www.youtube.com/embed/${id}?playsinline=1&rel=0&autoplay=1&enablejsapi=1`+(location.protocol.startsWith('http')?'&origin='+encodeURIComponent(location.origin):'');$('#ytp').style.display='block';$('#ytf').src=ytUrl;$('#ytw').style.display='block';$('#ytw').href='https://www.youtube.com/watch?v='+id;now={id,t:t||'YouTube video',c:c||'YouTube'};playing=true;isl()}

$('#ytform').onsubmit=x=>{x.preventDefault();const v=$('#yti').value.trim();if(!v)return load('');const m=v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);m?play(m[1]):load(v)};

/* Notes (list + editor, saved) */
$('#app-notes').innerHTML=`<div id="nl"><div class="nh"><h1>Notes</h1><b id="na">＋</b></div><div id="nli"></div></div>
<div id="ne" style="display:none;flex-direction:column;flex:1;min-height:0"><div class="nh"><b id="nb">‹ Notes</b><b id="nd">🗑</b></div><textarea id="nt" placeholder="Start typing…"></textarea></div>`;
let N=[],ni=-1;try{N=JSON.parse(localStorage.getItem('ph-notes')||'[]')}catch(x){}
const ns=()=>{try{localStorage.setItem('ph-notes',JSON.stringify(N))}catch(x){}};
function nlist(){$('#nl').style.display='block';$('#ne').style.display='none';$('#nli').innerHTML=N.map((n,i)=>{const L=n.t.split('\n');return `<div class="nr" data-i="${i}"><p>${esc(L[0]||'New Note')}</p><small>${esc(L[1]||'No additional text')}</small></div>`}).join('')||'<p class="ms">No notes yet. Tap ＋ to start.</p>'}
function nedit(i){ni=i;$('#nl').style.display='none';$('#ne').style.display='flex';$('#nt').value=N[i].t;$('#nt').focus()}
$('#na').onclick=()=>{N.unshift({t:''});nedit(0)};
$('#nli').onclick=x=>{const r=x.target.closest('.nr');if(r)nedit(+r.dataset.i)};
$('#nt').oninput=()=>{N[ni].t=$('#nt').value;ns()};
$('#nb').onclick=()=>{if(!N[ni].t.trim())N.splice(ni,1);ns();nlist()};
$('#nd').onclick=()=>{N.splice(ni,1);ns();nlist()};
nlist();wl();apply();

/* ===== YouTube keeps playing in the Dynamic Island ===== */
const isle=$('.island');
isle.innerHTML=`<img id="ilt" alt=""><div class="bars"><i></i><i></i><i></i><i></i></div><div class="meta"><b id="ilm"></b><span id="ilc"></span></div><div class="ctl"><b id="ilp">⏸</b><b id="ilx">✕</b></div>`;
function isl(){const on=!!now&&cur!=='yt';isle.classList.toggle('live',on);if(!on)isle.classList.remove('big');isle.classList.toggle('paused',!playing);
 if(now){$('#ilt').src=`https://i.ytimg.com/vi/${now.id}/mqdefault.jpg`;$('#ilm').textContent=now.t;$('#ilc').textContent=now.c}
 $('#ilp').textContent=playing?'⏸':'▶'}
function ytCmd(f){try{$('#ytf').contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:''}),'*')}catch(x){}}
function stopYt(){now=null;playing=false;ytUrl='';$('#ytf').src='about:blank';$('#ytp').style.display='none';$('#ytw').style.display='none';isl()}
isle.addEventListener('click',x=>{
 if(!isle.classList.contains('live'))return;
 if(x.target.closest('#ilp')){playing=!playing;ytCmd(playing?'playVideo':'pauseVideo');isl();return}
 if(x.target.closest('#ilx')){stopYt();return}
 if(isle.classList.contains('big')){isle.classList.remove('big');if(cur)close();open('yt',isle)}else isle.classList.add('big')});
scr.addEventListener('click',x=>{if(!x.target.closest('.island'))isle.classList.remove('big')});

/* ===== App switcher (swipe up on the home bar) ===== */
scr.insertAdjacentHTML('beforeend','<div id="sw"></div>');
const SW=$('#sw'),kk=()=>scr.getBoundingClientRect().width/430;
const hideSw=()=>{SW.style.display='none'};
function showSw(){
 ccT(0);if(cur)close();
 SW.innerHTML='';SW.style.display='flex';SW.scrollLeft=0;
 if(!R.length){SW.innerHTML='<p class="swe">No recent apps</p>';return}
 R.forEach(id=>{
  const c=document.createElement('div');c.className='sc2';c.dataset.id=id;
  const a=$('#app-'+id).cloneNode(true);
  a.removeAttribute('id');a.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  a.querySelectorAll('iframe').forEach(f=>{const d=document.createElement('div');d.style.cssText='width:100%;height:100%;background:#000';f.replaceWith(d)});
  a.classList.add('open','snap');a.style.transformOrigin='';
  c.innerHTML=`<div class="sl2"><div class="ic" style="background:${G[id][0]}"><svg viewBox="0 0 48 48">${G[id][1]}</svg></div>${NAMES[id]}</div><div class="sv"></div>`;
  c.querySelector('.sv').appendChild(a);SW.appendChild(c)})}
let sc=null;
SW.onpointerdown=x=>{const c=x.target.closest('.sc2');sc=c?{c,y:x.clientY,d:0}:null};
SW.onpointermove=x=>{if(!sc)return;sc.d=(x.clientY-sc.y)/kk();if(sc.d<0)sc.c.style.transform=`translateY(${sc.d}px)`};
SW.onpointerup=x=>{
 if(!sc){if(x.target===SW)hideSw();return}
 const {c,d}=sc;sc=null;c.style.transform='';
 if(d<-90){const id=c.dataset.id;c.style.transition='.3s';c.style.transform='translateY(-700px)';c.style.opacity=0;R=R.filter(r=>r!==id);if(id==='yt')stopYt();setTimeout(()=>{c.remove();if(!R.length)showSw()},300)}
 else if(Math.abs(d)<8){open(c.dataset.id,c);hideSw()}};
SW.onwheel=x=>{SW.scrollLeft+=x.deltaY};
addEventListener('keydown',x=>{if(x.key==='Escape')hideSw()});
const hi=$('#hi');let hy=0;
hi.onpointerdown=x=>{hy=x.clientY;hi.setPointerCapture(x.pointerId)};
hi.onpointerup=x=>{const d=(hy-x.clientY)/kk();ccT(0);if(d>110)showSw();else{hideSw();close()}};

/* ===== Maps (Leaflet + OpenStreetMap, no API key) ===== */
$('#apps').insertAdjacentHTML('beforeend',sec('maps',`<div id="mapw"><div id="map"></div><form class="mq" id="mform"><input id="mqi" dir="auto" placeholder="Search Maps"></form><div class="mfab" id="mloc">➤</div><div class="mfab" id="msat" style="bottom:108px;display:none">🛰</div><div class="minfo" id="minfo"></div></div>`));
const HOME=[8,-150],HOMETXT='Pacific Ocean · 8.0°N, 150.0°W';
let map,pin;
const info=(t,s)=>{$('#minfo').innerHTML=`<b>${esc(t)}</b><br><span>${esc(s)}</span>`};
function mapInit(){if(GMAPS_KEY){gInit();return}
 if(map){setTimeout(()=>map.invalidateSize(),520);return}
 if(!window.L){info('Map unavailable','Check your internet connection');return}
 map=L.map('map',{zoomControl:false}).setView(HOME,5);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 L.marker(HOME,{icon:L.divIcon({className:'',html:'<div class="mdot"></div>',iconSize:[20,20]})}).addTo(map);
 info('My Location',HOMETXT);
 setTimeout(()=>map.invalidateSize(),520)}
$('#mloc').onclick=()=>{if(GMAPS_KEY){gSet('');return}if(!map)return;if(pin){map.removeLayer(pin);pin=null}map.flyTo(HOME,5);info('My Location',HOMETXT)};
$('#mform').onsubmit=async x=>{x.preventDefault();const q=$('#mqi').value.trim();if(GMAPS_KEY){gSet(q);return}if(!q||!map)return;
 try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)),j=await r.json();
  if(!j[0]){info('No results',q);return}
  const p=[+j[0].lat,+j[0].lon];if(pin)map.removeLayer(pin);
  pin=L.circleMarker(p,{radius:9,color:'#fff',weight:3,fillColor:'#ff3b30',fillOpacity:1}).addTo(map);
  map.flyTo(p,12);info(j[0].display_name.split(',')[0],j[0].display_name)}
 catch(e){info('Search failed','Check your internet connection')}};

/* ===== TikTok (embed player + your own feed) ===== */
const NP='M26 10v18.500a6 6 0 1 1-6-6v4a2.200 2.200 0 1 0 2 2.200V10h4c.300 3.200 2.600 5.500 6 5.800v4c-2.400 0-4.500-.8-6-2z';
G.tt=['#000',`<path transform="translate(-1.500 1.500)" fill="#25f4ee" d="${NP}"/><path transform="translate(1.500 -1.500)" fill="#fe2c55" d="${NP}"/><path fill="#fff" d="${NP}"/>`];
NAMES.tt='TikTok';DARK.tt=1;
$('.grid').insertAdjacentHTML('beforeend',`<div class="ai">${ic('tt')}<span>TikTok</span></div>`);
$('#apps').insertAdjacentHTML('beforeend',sec('tt',`<form class="tth" id="ttform"><input id="tti" dir="auto" placeholder="Paste a TikTok link or @username"><button>Add</button></form><div id="ttf"></div>`));
let TT=null;try{TT=JSON.parse(localStorage.getItem('ph-tt')||'null')}catch(x){}
if(!TT)TT=[{id:'6718335390845095173'}];
const tts=()=>{try{localStorage.setItem('ph-tt',JSON.stringify(TT))}catch(x){}};
function ttSize(){const h=$('#ttf').clientHeight;document.querySelectorAll('.tti').forEach(e=>e.style.height=h+'px')}
function ttLoad(){
 const f=$('#ttf'),its=[...f.querySelectorAll('.tti')];if(!its.length)return;
 ttSize();const a=Math.round(f.scrollTop/(f.clientHeight||1));
 its.forEach((e,i)=>{let fr=e.querySelector('iframe');
  if(i===a){if(!fr){fr=document.createElement('iframe');fr.allow='autoplay; encrypted-media; fullscreen';fr.referrerPolicy='strict-origin-when-cross-origin';
   fr.src=TT[i].u?`https://www.tiktok.com/embed/@${TT[i].u}`:`https://www.tiktok.com/embed/v2/${TT[i].id}`;e.prepend(fr)}}
  else if(fr)fr.remove()})}
function ttStop(){document.querySelectorAll('.tti iframe').forEach(f=>f.remove())}
function ttRender(){
 $('#ttf').innerHTML=TT.map((v,i)=>`<div class="tti"><div class="x" data-del="${i}">🗑</div></div>`).join('')||'<p class="ms">Paste a TikTok video link above (tiktok.com/@user/video/123…) to add it to your feed.</p>';
 ttLoad()}
let ttT;$('#ttf').onscroll=()=>{clearTimeout(ttT);ttT=setTimeout(ttLoad,150)};
$('#ttf').onclick=x=>{const d=x.target.closest('[data-del]');if(d){TT.splice(+d.dataset.del,1);tts();ttRender()}};
$('#ttform').onsubmit=x=>{x.preventDefault();const i=$('#tti'),v=i.value.trim();if(!v)return;
 const m=v.match(/\/video\/(\d{8,})/),u=v.match(/^@([\w.]{2,24})$/);
 if(m)TT.unshift({id:m[1]});else if(u)TT.unshift({u:u[1]});
 else{i.value='';i.placeholder='Use the full link (…/video/123…) or @username';return}
 i.value='';tts();ttRender();$('#ttf').scrollTop=0};
ttRender();

/* ===== Google Maps (Embed API) ===== */
let gT='roadmap',gQ='',gDone=0;
function gSet(q){gQ=q;const b='https://www.google.com/maps/embed/v1/',k=`?key=${GMAPS_KEY}&maptype=${gT}`;
 const u=q?`${b}search${k}&q=${encodeURIComponent(q)}`:`${b}place${k}&q=${HOME[0]},${HOME[1]}&zoom=4`;
 $('#map').innerHTML=`<iframe src="${u}" style="width:100%;height:100%;border:0" allowfullscreen loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe>`}
function gInit(){if(gDone)return;gDone=1;$('#mapw').classList.add('g');$('#minfo').style.display='none';$('#msat').style.display='flex';gSet('')}
$('#msat').onclick=()=>{gT=gT==='roadmap'?'satellite':'roadmap';gSet(gQ)};

/* ===== ChatGPT (OpenAI API, key stays in this browser) ===== */
G.gpt=['#10a37f','<g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 8l13.900 8v16L24 40 10.100 32V16z"/><path d="M24 8v16l13.900 8M24 24 10.100 32"/></g>'];
NAMES.gpt='ChatGPT';
$('.grid').insertAdjacentHTML('beforeend',`<div class="ai">${ic('gpt')}<span>ChatGPT</span></div>`);
$('#apps').insertAdjacentHTML('beforeend',sec('gpt',`<div class="gh"><div>ChatGPT<small id="gmod"></small></div><div><b id="gnew">✎</b><b id="gset">⚙</b></div></div><div id="gm"></div>
<div class="gi"><textarea id="gt" rows="1" dir="auto" placeholder="Message ChatGPT"></textarea><button id="gsend">↑</button></div>
<div class="gs" id="gs"><h2 style="margin:0">Settings</h2><label>OpenAI API key (saved only in this browser)</label><input id="gk" type="password" placeholder="sk-..."><label>Model</label><input id="gmi" placeholder="gpt-5-mini"><button id="gsave">Save</button><a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">Get an API key ↗</a></div>`));
const ls=(k,d)=>{try{return localStorage.getItem(k)||d}catch(x){return d}};
let GK=ls('ph-gk',''),GM=ls('ph-gm','gpt-5-mini'),H=[],busy=false;
try{H=JSON.parse(ls('ph-gpt','[]'))}catch(x){}
const gSave=()=>{try{localStorage.setItem('ph-gpt',JSON.stringify(H.slice(-40)))}catch(x){}};
function md(s){return esc(s).split(/(```[\s\S]*?```)/g).map(p=>p.startsWith('```')?'<pre><code>'+p.replace(/^```\w*\n?/,'').replace(/```$/,'')+'</code></pre>':p.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')).join('')}
function gRender(){
 $('#gmod').textContent=GM;
 $('#gm').innerHTML=H.map((m,i)=>m.role==='user'?`<div class="gu" dir="auto">${esc(m.content)}</div>`:`<div class="ga" dir="auto">${m.content?md(m.content):(busy&&i===H.length-1?'▍':'')}</div>`).join('')||`<p class="ms">${(GK||GPT_PROXY)?'How can I help?':'Tap ⚙ and add your OpenAI API key to start.'}</p>`;
 $('#gm').scrollTop=1e9}
async function gcall(a,st){
 const r=await fetch(GPT_PROXY||'https://api.openai.com/v1/chat/completions',{method:'POST',headers:GPT_PROXY?{'Content-Type':'application/json'}:{'Content-Type':'application/json',Authorization:'Bearer '+GK},body:JSON.stringify({model:GM,stream:st,messages:[{role:'system',content:'You are ChatGPT inside a phone app. Reply in the same language the user writes in. Be concise.'},...H.slice(0,-1).slice(-30)]})});
 if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error&&j.error.message||r.status)}
 if(!st){a.content=(await r.json()).choices[0].message.content;return}
 const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
 for(;;){const {done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const L=buf.split('\n');buf=L.pop();
  for(const l of L){if(!l.startsWith('data: '))continue;const d=l.slice(6);if(d==='[DONE]')continue;
   try{const c=JSON.parse(d).choices[0].delta.content;if(c){a.content+=c;$('#gm').lastElementChild.innerHTML=md(a.content)+'▍';$('#gm').scrollTop=1e9}}catch(x){}}}}
async function gsend(){
 const t=$('#gt'),v=t.value.trim();if(!v||busy)return;
 if(!GK&&!GPT_PROXY){$('#gs').classList.add('open');return}
 t.value='';t.style.height='';H.push({role:'user',content:v},{role:'assistant',content:''});busy=true;gRender();
 const a=H[H.length-1];
 try{try{await gcall(a,true)}catch(x){if(/stream/i.test(x.message)&&!a.content)await gcall(a,false);else throw x}}
 catch(x){a.content+=(a.content?'\n\n':'')+'⚠️ '+x.message}
 busy=false;gSave();gRender()}
$('#gsend').onclick=gsend;
$('#gt').onkeydown=x=>{if(x.key==='Enter'&&!x.shiftKey){x.preventDefault();gsend()}};
$('#gt').oninput=function(){this.style.height='auto';this.style.height=Math.min(120,this.scrollHeight)+'px'};
$('#gnew').onclick=()=>{if(busy)return;H=[];gSave();gRender()};
$('#gset').onclick=()=>{$('#gk').value=GK;$('#gmi').value=GM;$('#gs').classList.toggle('open')};
$('#gsave').onclick=()=>{GK=$('#gk').value.trim();GM=$('#gmi').value.trim()||'gpt-5-mini';try{localStorage.setItem('ph-gk',GK);localStorage.setItem('ph-gm',GM)}catch(x){}$('#gs').classList.remove('open');gRender()};
gRender();

/* Fit phone to window */
function fit(){document.documentElement.style.setProperty('--s',Math.min(1,(innerHeight-24)/964,(innerWidth-8)/462))}
fit();addEventListener('resize',fit);
</script>
